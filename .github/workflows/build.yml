name: Build Controller Bridge V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create project folders
        run: |
          mkdir -p app/src/main/java/com/example/controllerbridge
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ControllerBridge"
          include ":app"
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.controllerbridge'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.controllerbridge'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Controller Bridge"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3F51B5</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/example/controllerbridge/MainActivity.java <<'EOF'
          package com.example.controllerbridge;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.Socket;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView controllerText;
              private TextView networkText;
              private TextView inputText;
              private TextView stickText;

              private EditText ipInput;
              private EditText portInput;

              private Socket socket;
              private OutputStream output;

              private volatile float lx = 0;
              private volatile float ly = 0;
              private volatile float rx = 0;
              private volatile float ry = 0;

              private volatile int lastKey = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 32, 32, 32);

                  controllerText = makeText(
                          "🔴 Controller: not detected",
                          20
                  );

                  networkText = makeText(
                          "🔴 Windows: disconnected",
                          18
                  );

                  inputText = makeText(
                          "Last input: —",
                          18
                  );

                  stickText = makeText(
                          "Left stick:  X 0.00  Y 0.00\n" +
                          "Right stick: X 0.00  Y 0.00",
                          18
                  );

                  ipInput = new EditText(this);
                  ipInput.setHint("Windows IP address");
                  ipInput.setText("192.168.42.1");
                  ipInput.setSingleLine(true);

                  portInput = new EditText(this);
                  portInput.setHint("Port");
                  portInput.setText("5555");
                  portInput.setInputType(2);
                  portInput.setSingleLine(true);

                  Button connectButton = new Button(this);
                  connectButton.setText("CONNECT TO WINDOWS");

                  connectButton.setOnClickListener(
                          v -> connectToWindows()
                  );

                  layout.addView(controllerText);
                  layout.addView(networkText);
                  layout.addView(inputText);
                  layout.addView(stickText);
                  layout.addView(ipInput);
                  layout.addView(portInput);
                  layout.addView(connectButton);

                  TextView info = makeText(
                          "USB networking prototype.\n\n" +
                          "Connect the phone to Windows with USB " +
                          "and enable USB tethering. Then enter the " +
                          "Windows IP address and connect.",
                          15
                  );

                  layout.addView(info);

                  setContentView(layout);

                  updateController();
              }

              private TextView makeText(
                      String text,
                      float size
              ) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setPadding(0, 12, 0, 12);
                  return view;
              }

              private void connectToWindows() {

                  final String ip =
                          ipInput.getText().toString().trim();

                  final String portText =
                          portInput.getText().toString().trim();

                  final int port;

                  try {
                      port = Integer.parseInt(portText);
                  } catch (Exception e) {
                      networkText.setText(
                              "🔴 Invalid port"
                      );
                      return;
                  }

                  networkText.setText(
                          "🟡 Connecting..."
                  );

                  new Thread(() -> {

                      try {

                          if (socket != null) {
                              try {
                                  socket.close();
                              } catch (Exception ignored) {
                              }
                          }

                          socket = new Socket(ip, port);

                          output =
                                  socket.getOutputStream();

                          runOnUiThread(() ->
                                  networkText.setText(
                                          "🟢 Windows: connected"
                                  )
                          );

                          sendControllerData();

                      } catch (Exception e) {

                          runOnUiThread(() ->
                                  networkText.setText(
                                          "🔴 Connection failed: " +
                                          e.getMessage()
                                  )
                          );
                      }

                  }).start();
              }

              private synchronized void sendLine(
                      String line
              ) {

                  try {

                      if (output == null) {
                          return;
                      }

                      output.write(
                              (line + "\n")
                                      .getBytes()
                      );

                      output.flush();

                  } catch (Exception ignored) {
                  }
              }

              private void sendControllerData() {

                  sendLine(
                          String.format(
                                  Locale.US,
                                  "LX=%.3f;LY=%.3f;RX=%.3f;RY=%.3f;KEY=%d",
                                  lx,
                                  ly,
                                  rx,
                                  ry,
                                  lastKey
                          )
                  );
              }

              @Override
              public boolean dispatchKeyEvent(
                      KeyEvent event
              ) {

                  if (event.getAction() ==
                          KeyEvent.ACTION_DOWN) {

                      lastKey =
                              event.getKeyCode();

                      inputText.setText(
                              "Button DOWN: " +
                              getButtonName(lastKey)
                      );

                      sendControllerData();

                      updateController();
                  }

                  if (event.getAction() ==
                          KeyEvent.ACTION_UP) {

                      lastKey = 0;

                      inputText.setText(
                              "Button UP: " +
                              getButtonName(
                                      event.getKeyCode()
                              )
                      );

                      sendControllerData();
                  }

                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean dispatchGenericMotionEvent(
                      MotionEvent event
              ) {

                  if (event.getAction() ==
                          MotionEvent.ACTION_MOVE) {

                      if ((event.getSource() &
                              InputDevice.SOURCE_CLASS_JOYSTICK)
                              != 0) {

                          lx =
                                  event.getAxisValue(
                                          MotionEvent.AXIS_X
                                  );

                          ly =
                                  event.getAxisValue(
                                          MotionEvent.AXIS_Y
                                  );

                          rx =
                                  event.getAxisValue(
                                          MotionEvent.AXIS_Z
                                  );

                          ry =
                                  event.getAxisValue(
                                          MotionEvent.AXIS_RZ
                                  );

                          stickText.setText(
                                  String.format(
                                          Locale.US,
                                          "Left stick:  X %+.2f  Y %+.2f\n" +
                                          "Right stick: X %+.2f  Y %+.2f",
                                          lx,
                                          ly,
                                          rx,
                                          ry
                                  )
                          );

                          inputText.setText(
                                  "Analog movement"
                          );

                          sendControllerData();

                          return true;
                      }
                  }

                  return super.dispatchGenericMotionEvent(
                          event
                  );
              }

              private void updateController() {

                  InputDevice found = null;

                  for (int id :
                          InputDevice.getDeviceIds()) {

                      InputDevice device =
                              InputDevice.getDevice(id);

                      if (device == null) {
                          continue;
                      }

                      int sources =
                              device.getSources();

                      boolean gamepad =
                              (sources &
                                      InputDevice.SOURCE_GAMEPAD)
                                      == InputDevice.SOURCE_GAMEPAD;

                      boolean joystick =
                              (sources &
                                      InputDevice.SOURCE_JOYSTICK)
                                      == InputDevice.SOURCE_JOYSTICK;

                      if (gamepad || joystick) {
                          found = device;
                          break;
                      }
                  }

                  if (found == null) {

                      controllerText.setText(
                              "🔴 Controller: not detected"
                      );

                  } else {

                      controllerText.setText(
                              "🟢 Controller detected\n" +
                              "Name: " +
                              found.getName()
                      );
                  }
              }

              private String getButtonName(
                      int code
              ) {

                  switch (code) {

                      case KeyEvent.KEYCODE_BUTTON_A:
                          return "A / Cross";

                      case KeyEvent.KEYCODE_BUTTON_B:
                          return "B / Circle";

                      case KeyEvent.KEYCODE_BUTTON_X:
                          return "X / Square";

                      case KeyEvent.KEYCODE_BUTTON_Y:
                          return "Y / Triangle";

                      case KeyEvent.KEYCODE_BUTTON_L1:
                          return "L1";

                      case KeyEvent.KEYCODE_BUTTON_R1:
                          return "R1";

                      case KeyEvent.KEYCODE_BUTTON_L2:
                          return "L2";

                      case KeyEvent.KEYCODE_BUTTON_R2:
                          return "R2";

                      case KeyEvent.KEYCODE_BUTTON_START:
                          return "Start";

                      case KeyEvent.KEYCODE_BUTTON_SELECT:
                          return "Select";

                      case KeyEvent.KEYCODE_DPAD_UP:
                          return "D-pad UP";

                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          return "D-pad DOWN";

                      case KeyEvent.KEYCODE_DPAD_LEFT:
                          return "D-pad LEFT";

                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                          return "D-pad RIGHT";

                      default:
                          return "Key " + code;
                  }
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ControllerBridge-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
